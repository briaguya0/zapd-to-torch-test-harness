# Majora's Mask. Torch maps a ROM's SHA1 to a version directory and to the
# filelist it resolves named segment offsets against (see assets/yml/README.md).
#
# The config block below is inherited from the OoT setup and is only as verified
# as what has been extracted so far: with these settings 9495 of 10014 declared
# textures come out byte-identical to the reference. gbi/sort/primary_virtual_segment
# have not been independently confirmed against MM's other asset types.

d6133ace5afaa0882cf214cf88daba39e266c078:
  name: Legend of Zelda, The - Majora's Mask (USA)
  path: ntsc_u
  filelist: ntsc_u.filelist.yml
  config:
    gbi: F3DEX2_OoT
    sort: OFFSET
    logging: CRITICAL
    primary_virtual_segment: 0x80
    output:
      binary: mm.o2r
